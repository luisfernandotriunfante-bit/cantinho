<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffd6e7">
<title>Nosso Cantinho</title>
<style>
:root, [data-theme="rosa"]{
  --bg:#fff0f6; --bg2:#ffe0ee; --card:#ffffff; --ink:#5a2a41; --soft:#a5677f;
  --accent:#ff6fa5; --accent2:#ff9ec4; --on-accent:#fff; --line:#ffc9de;
  --radius:22px; --font:'Trebuchet MS','Segoe UI',system-ui,sans-serif; --shadow:0 6px 18px rgba(255,111,165,.22);
}
[data-theme="vintage"]{
  --bg:#f6ecdc; --bg2:#ecdcbf; --card:#fffaf0; --ink:#4b3424; --soft:#8a6a52;
  --accent:#c0623f; --accent2:#d99a6c; --on-accent:#fff8ee; --line:#dcc6a3;
  --radius:12px; --font:Georgia,'Times New Roman',serif; --shadow:0 4px 12px rgba(120,80,40,.2);
}
[data-theme="minimal"]{
  --bg:#fbfbfc; --bg2:#f0f0f3; --card:#ffffff; --ink:#22222a; --soft:#7b7b88;
  --accent:#e0566b; --accent2:#f08a99; --on-accent:#fff; --line:#e6e6ec;
  --radius:16px; --font:system-ui,-apple-system,'Segoe UI',sans-serif; --shadow:0 2px 10px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;
  padding-top:env(safe-area-inset-top);}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;letter-spacing:.3px}
header small{color:var(--soft);display:block;font-size:12px;margin-top:2px}
#sync{font-size:12px;color:var(--soft)}
main{flex:1;overflow-y:auto;padding:6px 16px 90px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);
  display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:22px;color:var(--soft);font-family:var(--font)}
nav button span{display:block;font-size:10.5px;margin-top:1px}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:var(--shadow)}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--soft);font-size:13px}
button.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:11px 20px;
  font-size:15px;font-family:var(--font);box-shadow:var(--shadow)}
button.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1.5px solid var(--accent)}
button.btn:active{transform:scale(.96)}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:14px;padding:11px 13px;font-size:15px;font-family:var(--font);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:14px;
  color:var(--ink);font-family:var(--font)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.big-heart{width:150px;height:150px;border-radius:50%;border:0;margin:8px auto;display:block;font-size:64px;
  background:radial-gradient(circle at 30% 30%,var(--accent2),var(--accent));box-shadow:0 10px 30px rgba(0,0,0,.18);
  animation:beat 2.4s infinite}
.big-heart:active{transform:scale(.92)}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.08)}16%{transform:scale(1)}24%{transform:scale(1.05)}}
.req{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.req:last-child{border:0}
.req .ic{font-size:28px}
.req .tx{flex:1}
.req .tx b{display:block}
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border:0}
.todo .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:none;flex:none;
  color:var(--on-accent);font-size:15px;line-height:1}
.todo.done .box{background:var(--accent)}
.todo.done .tx{text-decoration:line-through;opacity:.55}
.todo .tx{flex:1}
.x{background:none;border:0;color:var(--soft);font-size:18px;padding:4px 8px}
.grid{columns:2;column-gap:10px}
.photo{break-inside:avoid;margin-bottom:10px;background:var(--card);border-radius:calc(var(--radius) - 6px);overflow:hidden;
  box-shadow:var(--shadow)}
.photo img{width:100%;display:block}
.photo p{margin:0;padding:8px 10px;font-size:12.5px;color:var(--soft)}
.hero{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--card);margin:10px 0}
.hero img{width:100%;max-height:340px;object-fit:cover;display:block}
.hero p{margin:0;padding:12px 14px}
.note{padding:12px 14px;border-radius:var(--radius);margin:10px 0;max-width:86%;box-shadow:var(--shadow)}
.note.me{background:var(--accent);color:var(--on-accent);margin-left:auto;border-bottom-right-radius:4px}
.note.other{background:var(--card);border-bottom-left-radius:4px}
.note small{display:block;opacity:.7;font-size:11px;margin-top:4px}
.count{text-align:center;padding:10px}
.count .n{font-size:56px;font-weight:bold;color:var(--accent);line-height:1}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}
.float{position:fixed;pointer-events:none;font-size:28px;animation:up 1.4s forwards;z-index:30}
@keyframes up{to{transform:translateY(-220px);opacity:0}}
.hide{display:none!important}
label.l{display:block;font-size:13px;color:var(--soft);margin:12px 0 5px}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:1px 7px;margin-left:3px;
  vertical-align:top}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1 id="title">Nosso Cantinho 💗</h1><small id="sub"></small></div>
    <div id="sync"></div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ util ============ */
const $ = (s, el=document) => el.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }
function floaty(emoji, n=7){ for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='float'; s.textContent=emoji;
  s.style.left=(20+Math.random()*60)+'vw'; s.style.bottom=(20+Math.random()*15)+'vh'; s.style.animationDelay=(i*.08)+'s';
  document.body.appendChild(s); setTimeout(()=>s.remove(),1800);} }
function ago(t){ const m=Math.round((now()-t)/60000); if(m<1) return 'agora'; if(m<60) return m+' min'; const h=Math.round(m/60);
  if(h<24) return h+' h'; return new Date(t).toLocaleDateString('pt-BR'); }
function safeGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function safeSet(k,v){ try{localStorage.setItem(k,v)}catch(e){} }

/* ============ dados ============ */
const COLS = ['carinhos','tarefas','fotos','recados','datas'];
const CARINHOS = [
  {k:'abraco',e:'🤗',t:'Abraço'}, {k:'cafune',e:'🥰',t:'Cafuné'}, {k:'beijo',e:'😘',t:'Beijinho'},
  {k:'colo',e:'🧸',t:'Colinho'}, {k:'massagem',e:'💆‍♀️',t:'Massagem'}, {k:'dengo',e:'🐱',t:'Dengo'},
  {k:'conversa',e:'💬',t:'Conversar'}, {k:'filme',e:'🎬',t:'Filminho juntos'}
];
const FRASES = [
  'Você faz meu dia ficar mais leve.','Casa boa é onde você está.','Te escolheria em todas as vidas.',
  'Seu sorriso é meu lugar preferido.','Obrigado por cuidar de mim do seu jeitinho.','Hoje eu só quero te dar um abraço apertado.',
  'Você é minha pessoa favorita.','Com você até o cansaço passa.','Que sorte a minha ter você.'
];
let S = { cfg:{ nome:'', par:'', eu:'', tema:'rosa', inicio:'', code:'', url:'', key:'' },
          carinhos:[], tarefas:[], fotos:[], recados:[], datas:[], seen:{ recados:0 } };
let tab = 'carinho';

function loadLocal(){
  try{ const r = JSON.parse(safeGet('nc_state')||'null'); if(r) S = Object.assign(S, r, {cfg:Object.assign(S.cfg, r.cfg||{})}); }catch(e){}
}
function saveLocal(){ safeSet('nc_state', JSON.stringify(S)); }

/* ============ sincronização (Supabase via fetch, opcional) ============ */
const remoteOn = () => S.cfg.url && S.cfg.key && S.cfg.code;
const H = () => ({ apikey:S.cfg.key, Authorization:'Bearer '+S.cfg.key, 'Content-Type':'application/json' });
const rk = c => S.cfg.code + ':' + c;

function mergeLists(a, b){
  const m = new Map();
  [...(a||[]), ...(b||[])].forEach(it => { const o = m.get(it.id); if(!o || (it.u||0) > (o.u||0)) m.set(it.id, it); });
  return [...m.values()];
}
async function syncNow(silent){
  if(!remoteOn()){ $('#sync').textContent = 'só neste celular'; return; }
  try{
    $('#sync').textContent = 'sincronizando…';
    const keys = COLS.concat(['config']).map(c => '"'+rk(c)+'"').join(',');
    const res = await fetch(S.cfg.url.replace(/\/$/,'') + '/rest/v1/kv?key=in.('+encodeURIComponent(keys)+')&select=key,value', {headers:H()});
    if(!res.ok) throw new Error(res.status);
    const rows = await res.json(); const remote = {}; rows.forEach(r => remote[r.key.slice(S.cfg.code.length+1)] = r.value);
    const up = [];
    COLS.forEach(c => {
      const merged = mergeLists(S[c], remote[c]);
      const changedLocal = JSON.stringify(merged) !== JSON.stringify(S[c]);
      const changedRemote = JSON.stringify(merged) !== JSON.stringify(remote[c]||[]);
      S[c] = merged;
      if(changedRemote) up.push({key:rk(c), value:merged, updated_at:new Date().toISOString()});
      if(changedLocal) S._dirty = true;
    });
    // config compartilhada: tema e data de inicio (o mais recente vence)
    const rc = remote.config || {};
    const lc = { tema:S.cfg.tema, inicio:S.cfg.inicio, u:S.cfg.u||0 };
    if((rc.u||0) > lc.u){ S.cfg.tema = rc.tema||S.cfg.tema; S.cfg.inicio = rc.inicio||S.cfg.inicio; S.cfg.u = rc.u; }
    else if(lc.u > (rc.u||0)) up.push({key:rk('config'), value:lc, updated_at:new Date().toISOString()});
    if(up.length){
      const r2 = await fetch(S.cfg.url.replace(/\/$/,'') + '/rest/v1/kv?on_conflict=key', {method:'POST',
        headers:Object.assign(H(),{Prefer:'resolution=merge-duplicates'}), body:JSON.stringify(up)});
      if(!r2.ok) throw new Error(r2.status);
    }
    saveLocal(); applyTheme(); detectNew();
    $('#sync').textContent = '💞 em sincronia';
    if(!silent) render();
  }catch(e){ $('#sync').textContent = 'sem conexão'; }
}
let lastPending = -1, lastNotes = -1;
function detectNew(){
  const pend = S.carinhos.filter(x=>!x.del && !x.done && x.by!==S.cfg.eu).length;
  const notes = S.recados.filter(x=>!x.del && x.by!==S.cfg.eu).length;
  if(lastPending>=0 && pend>lastPending){ toast('💗 Pedido novo de '+S.cfg.par+'!'); floaty('💗',5); }
  if(lastNotes>=0 && notes>lastNotes){ toast('💌 Recadinho novo!'); }
  lastPending = pend; lastNotes = notes;
  render(true);
}
function commit(){ saveLocal(); render(); syncNow(true); }

/* ============ tema ============ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.cfg.tema||'rosa');
  const c = getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim();
  document.querySelector('meta[name=theme-color]').setAttribute('content', c||'#ffd6e7');
}

/* ============ telas ============ */
const TABS = [['carinho','💗','Carinho'],['tarefas','📝','Afazeres'],['fotos','📸','Fotos'],['recados','💌','Recados'],['juntos','🎂','Nós']];
function renderNav(){
  const pend = S.carinhos.filter(x=>!x.del&&!x.done&&x.by!==S.cfg.eu).length;
  const tp = S.tarefas.filter(x=>!x.del&&!x.done&&x.by!==S.cfg.eu).length;
  const un = S.recados.filter(x=>!x.del&&x.by!==S.cfg.eu&&x.t>(S.seen.recados||0)).length;
  const badge = {carinho:pend, tarefas:tp, recados:un};
  $('#nav').innerHTML = TABS.map(([k,e,t]) =>
    `<button class="${tab===k?'on':''}" data-t="${k}">${e}<span>${t}${badge[k]?`<b class="badge">${badge[k]}</b>`:''}</span></button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { tab=b.dataset.t; if(tab==='recados'){S.seen.recados=now();saveLocal();} render(); $('#main').scrollTop=0; });
}
function render(keepScroll){
  if(!S.cfg.eu){ return renderSetup(); }
  const y = $('#main').scrollTop;
  const active = document.activeElement;
  if(keepScroll && active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) { renderNav(); return; }
  renderNav();
  $('#title').textContent = 'Nosso Cantinho 💗';
  $('#sub').textContent = 'Oi, ' + S.cfg.nome + '!';
  ({carinho:vCarinho, tarefas:vTarefas, fotos:vFotos, recados:vRecados, juntos:vJuntos}[tab])();
  if(keepScroll) $('#main').scrollTop = y;
}

/* --- setup inicial --- */
function renderSetup(){
  $('#nav').innerHTML=''; $('#sub').textContent='';
  $('#main').innerHTML = `
    <div class="card"><h2>Bem-vindos! 🌷</h2>
      <p class="muted">Vamos deixar o cantinho de vocês do jeitinho de vocês. Cada um faz isso uma vez no seu celular.</p>
      <label class="l">Quem está usando este celular?</label>
      <div class="chips" id="who"><button class="chip" data-w="ela">Ela</button><button class="chip" data-w="ele">Ele</button></div>
      <label class="l">Seu nome (como aparece pro outro)</label><input id="s_nome" placeholder="Seu nome">
      <label class="l">Nome do seu amor</label><input id="s_par" placeholder="Nome dela/dele">
      <label class="l">Data que vocês começaram (namoro/casamento)</label><input id="s_ini" type="date">
      <label class="l">Código secreto de vocês (o mesmo nos dois celulares)</label><input id="s_code" placeholder="ex: nossoamor2026">
      <details style="margin-top:14px"><summary class="muted">Sincronizar entre os dois celulares (Supabase)</summary>
        <label class="l">URL do projeto</label><input id="s_url" placeholder="https://xxxx.supabase.co">
        <label class="l">Chave anon</label><input id="s_key" placeholder="eyJ...">
        <p class="muted">Sem isso o app funciona, mas cada celular guarda só os seus dados. Passo a passo no README.</p>
      </details>
      <div style="margin-top:16px"><button class="btn" id="s_ok">Começar 💞</button></div>
    </div>`;
  let who='';
  $('#who').querySelectorAll('button').forEach(b => b.onclick = () => { who=b.dataset.w; $('#who').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#s_ok').onclick = () => {
    if(!who || !$('#s_nome').value.trim()){ toast('Escolha quem é você e seu nome'); return; }
    S.cfg.eu = who; S.cfg.nome = $('#s_nome').value.trim(); S.cfg.par = $('#s_par').value.trim() || 'meu amor';
    S.cfg.inicio = $('#s_ini').value; S.cfg.code = $('#s_code').value.trim(); S.cfg.url = $('#s_url').value.trim(); S.cfg.key = $('#s_key').value.trim();
    S.cfg.u = now(); saveLocal(); render(); syncNow();
  };
}

/* --- carinho --- */
let pickC = 'abraco';
function vCarinho(){
  const list = S.carinhos.filter(x=>!x.del).sort((a,b)=>b.t-a.t);
  const pend = list.filter(x=>!x.done && x.by!==S.cfg.eu);
  const mine = list.filter(x=>!x.done && x.by===S.cfg.eu);
  const done = list.filter(x=>x.done).slice(0,8);
  const c = k => CARINHOS.find(x=>x.k===k) || CARINHOS[0];
  $('#main').innerHTML = `
    <div class="card" style="text-align:center">
      <h2>Quer um carinho?</h2>
      <div class="chips" id="cc" style="justify-content:center">${CARINHOS.map(x=>`<button class="chip ${pickC===x.k?'on':''}" data-k="${x.k}">${x.e} ${x.t}</button>`).join('')}</div>
      <button class="big-heart" id="pedir">💗</button>
      <div class="muted">toque no coração para pedir ${esc(c(pickC).t.toLowerCase())}</div>
    </div>
    ${pend.length?`<div class="card"><h2>💌 ${esc(S.cfg.par)} está pedindo</h2>${pend.map(x=>`
      <div class="req"><div class="ic">${c(x.k).e}</div><div class="tx"><b>${esc(c(x.k).t)}</b><span class="muted">${ago(x.t)}</span></div>
      <button class="btn" data-ok="${x.id}">Atendido 💗</button></div>`).join('')}</div>`:''}
    ${mine.length?`<div class="card"><h2>⏳ Aguardando</h2>${mine.map(x=>`
      <div class="req"><div class="ic">${c(x.k).e}</div><div class="tx"><b>${esc(c(x.k).t)}</b><span class="muted">pedido ${ago(x.t)}</span></div>
      <button class="x" data-del="${x.id}">✕</button></div>`).join('')}</div>`:''}
    <div class="card"><h2>Carinhos dados 🥰 <span class="muted">(${S.carinhos.filter(x=>!x.del&&x.done).length} no total)</span></h2>
      ${done.length?done.map(x=>`<div class="req"><div class="ic">${c(x.k).e}</div><div class="tx"><b>${esc(c(x.k).t)}</b><span class="muted">${ago(x.doneAt||x.t)}</span></div></div>`).join(''):'<p class="muted">Ainda nenhum… bora começar!</p>'}
    </div>`;
  $('#cc').querySelectorAll('button').forEach(b => b.onclick = () => { pickC=b.dataset.k; vCarinho(); });
  $('#pedir').onclick = () => { S.carinhos.push({id:uid(), k:pickC, by:S.cfg.eu, t:now(), u:now()}); floaty('💗'); toast('Pedido enviado 💌'); commit(); };
  document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { const it=S.carinhos.find(x=>x.id===b.dataset.ok); it.done=true; it.doneAt=now(); it.u=now(); floaty('🥰'); commit(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const it=S.carinhos.find(x=>x.id===b.dataset.del); it.del=true; it.u=now(); commit(); });
}

/* --- tarefas --- */
function vTarefas(){
  const list = S.tarefas.filter(x=>!x.del).sort((a,b)=> (a.done-b.done) || (b.t-a.t));
  const row = x => `<div class="todo ${x.done?'done':''}"><button class="box" data-c="${x.id}">${x.done?'✓':''}</button>
    <div class="tx">${esc(x.txt)}<div class="muted">${x.by===S.cfg.eu?'pedido por você':'pedido por '+esc(S.cfg.par)} · ${ago(x.t)}</div></div>
    <button class="x" data-d="${x.id}">✕</button></div>`;
  const open = list.filter(x=>!x.done), fin = list.filter(x=>x.done).slice(0,12);
  $('#main').innerHTML = `
    <div class="card"><h2>Pedir um favorzinho 🔧</h2>
      <div class="row"><input id="tt" placeholder="ex: arrumar a porta do armário"><button class="btn" id="ta">+</button></div>
      <p class="muted" style="margin:8px 0 0">Vale pra qualquer coisa de casa: consertar, comprar, lembrar…</p></div>
    <div class="card"><h2>A fazer (${open.length})</h2>${open.length?open.map(row).join(''):'<p class="muted">Tudo em dia! 🎉</p>'}</div>
    ${fin.length?`<div class="card"><h2>Feitos ✅</h2>${fin.map(row).join('')}</div>`:''}`;
  const add = () => { const v=$('#tt').value.trim(); if(!v) return; S.tarefas.push({id:uid(), txt:v, by:S.cfg.eu, t:now(), u:now(), done:false}); commit(); };
  $('#ta').onclick = add; $('#tt').onkeydown = e => { if(e.key==='Enter') add(); };
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const it=S.tarefas.find(x=>x.id===b.dataset.c); it.done=!it.done; it.u=now(); if(it.done) floaty('✨',4); commit(); });
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const it=S.tarefas.find(x=>x.id===b.dataset.d); it.del=true; it.u=now(); commit(); });
}

/* --- fotos --- */
function resizeImage(file, max=900, q=.72){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = rej; img.src = url;
  });
}
let heroSeed = 0;
function vFotos(){
  const list = S.fotos.filter(x=>!x.del).sort((a,b)=>b.t-a.t);
  const day = Math.floor(now()/86400000);
  const hero = list.length ? list[(day + heroSeed) % list.length] : null;
  $('#main').innerHTML = `
    ${hero?`<div class="hero"><img src="${hero.img}"><p>✨ <b>Memória do dia</b><br><span class="muted">${esc(hero.cap||'')} · ${new Date(hero.t).toLocaleDateString('pt-BR')}</span></p>
      <p style="padding-top:0"><button class="btn ghost" id="shuf">🎲 Outra foto</button></p></div>`:''}
    <div class="card"><h2>Como foi seu dia? 📷</h2>
      <input id="fc" placeholder="Legenda (opcional)" style="margin-bottom:10px">
      <input id="ff" type="file" accept="image/*" class="hide" multiple>
      <button class="btn" id="fa">Adicionar foto</button></div>
    ${list.length?`<div class="grid">${list.map(x=>`<div class="photo"><img src="${x.img}" loading="lazy">
      <p>${esc(x.cap||'')}<br><span style="opacity:.7">${x.by===S.cfg.eu?'você':esc(S.cfg.par)} · ${ago(x.t)}</span>
      ${x.by===S.cfg.eu?` <button class="x" data-d="${x.id}" style="padding:0 4px">✕</button>`:''}</p></div>`).join('')}</div>`
      :'<p class="muted" style="text-align:center">Nenhuma foto ainda. Que tal a primeira? 🌼</p>'}`;
  $('#fa').onclick = () => $('#ff').click();
  if($('#shuf')) $('#shuf').onclick = () => { heroSeed += 1 + Math.floor(Math.random()*5); vFotos(); };
  $('#ff').onchange = async e => {
    const cap = $('#fc').value.trim();
    for(const f of e.target.files){ try{ const img = await resizeImage(f); S.fotos.push({id:uid(), img, cap, by:S.cfg.eu, t:now(), u:now()}); }catch(_){ toast('Não consegui ler essa foto'); } }
    floaty('📸',4); commit();
  };
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const it=S.fotos.find(x=>x.id===b.dataset.d); it.del=true; it.img=''; it.u=now(); commit(); });
}

/* --- recados --- */
function vRecados(){
  S.seen.recados = now(); saveLocal();
  const list = S.recados.filter(x=>!x.del).sort((a,b)=>a.t-b.t).slice(-60);
  $('#main').innerHTML = `
    <div class="card"><h2>Deixe um recadinho 💌</h2>
      <textarea id="rt" rows="3" placeholder="Escreva algo fofo…"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="ra">Enviar</button><button class="btn ghost" id="rf">✨ Sugestão</button></div></div>
    <div>${list.length?list.map(x=>`<div class="note ${x.by===S.cfg.eu?'me':'other'}">${esc(x.txt)}<small>${x.by===S.cfg.eu?'você':esc(S.cfg.par)} · ${ago(x.t)}</small></div>`).join(''):'<p class="muted" style="text-align:center">Nenhum recado ainda…</p>'}</div>`;
  $('#rf').onclick = () => { $('#rt').value = FRASES[Math.floor(Math.random()*FRASES.length)]; };
  $('#ra').onclick = () => { const v=$('#rt').value.trim(); if(!v) return; S.recados.push({id:uid(), txt:v, by:S.cfg.eu, t:now(), u:now()}); floaty('💌',4); commit(); };
}

/* --- nós (contador, datas, configurações) --- */
function daysBetween(a,b){ return Math.floor((b-a)/86400000); }
function nextOccur(dateStr){
  const d = new Date(dateStr+'T00:00:00'); const n = new Date(); n.setHours(0,0,0,0);
  let x = new Date(n.getFullYear(), d.getMonth(), d.getDate()); if(x<n) x = new Date(n.getFullYear()+1, d.getMonth(), d.getDate());
  return x;
}
function vJuntos(){
  const ini = S.cfg.inicio ? new Date(S.cfg.inicio+'T00:00:00') : null;
  const dias = ini ? daysBetween(ini, new Date()) : null;
  const datas = S.datas.filter(x=>!x.del).map(x=>({...x, nx:nextOccur(x.d)})).sort((a,b)=>a.nx-b.nx);
  const faltam = d => { const n=new Date(); n.setHours(0,0,0,0); const k=daysBetween(n,d.nx); return k===0?'É hoje! 🎉':`faltam ${k} dias`; };
  $('#main').innerHTML = `
    <div class="card count">${dias!==null?`<div class="n">${dias}</div><div>dias juntos 💞</div>
      <div class="muted">${Math.floor(dias/365)} anos e ${Math.floor((dias%365)/30)} meses</div>`:'<p class="muted">Defina a data de vocês em Configurações abaixo.</p>'}</div>
    <div class="card"><h2>Datas especiais 🎈</h2>
      ${datas.map(x=>`<div class="req"><div class="ic">${esc(x.e||'🎉')}</div><div class="tx"><b>${esc(x.n)}</b><span class="muted">${faltam(x)} · ${x.nx.toLocaleDateString('pt-BR')}</span></div><button class="x" data-d="${x.id}">✕</button></div>`).join('')||'<p class="muted">Adicione aniversários, viagens, primeiro beijo…</p>'}
      <div class="row" style="margin-top:12px"><input id="dn" placeholder="Nome (ex: Aniversário dela)"><input id="dd" type="date" style="max-width:150px"></div>
      <div style="margin-top:8px"><button class="btn" id="da">Adicionar</button></div></div>
    <div class="card"><h2>Tema do dia 🎨</h2>
      <div class="chips" id="th">
        <button class="chip ${S.cfg.tema==='rosa'?'on':''}" data-t="rosa">🌸 Rosinha e fofo</button>
        <button class="chip ${S.cfg.tema==='vintage'?'on':''}" data-t="vintage">📖 Aconchegante</button>
        <button class="chip ${S.cfg.tema==='minimal'?'on':''}" data-t="minimal">🤍 Minimalista</button>
      </div><p class="muted">O tema vale para os dois celulares.</p></div>
    <div class="card"><h2>Configurações ⚙️</h2>
      <label class="l">Data que começaram</label><input id="ci" type="date" value="${esc(S.cfg.inicio)}">
      <label class="l">Seu nome</label><input id="cn" value="${esc(S.cfg.nome)}">
      <label class="l">Nome do seu amor</label><input id="cp" value="${esc(S.cfg.par)}">
      <label class="l">Código secreto</label><input id="cc2" value="${esc(S.cfg.code)}">
      <label class="l">Supabase URL</label><input id="cu" value="${esc(S.cfg.url)}">
      <label class="l">Supabase chave anon</label><input id="ck" value="${esc(S.cfg.key)}">
      <div style="margin-top:12px"><button class="btn" id="cs">Salvar</button></div></div>`;
  $('#th').querySelectorAll('button').forEach(b => b.onclick = () => { S.cfg.tema=b.dataset.t; S.cfg.u=now(); applyTheme(); commit(); });
  $('#da').onclick = () => { const n=$('#dn').value.trim(), d=$('#dd').value; if(!n||!d) return toast('Preencha nome e data'); S.datas.push({id:uid(), n, d, e:'🎉', u:now()}); commit(); };
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const it=S.datas.find(x=>x.id===b.dataset.d); it.del=true; it.u=now(); commit(); });
  $('#cs').onclick = () => { S.cfg.inicio=$('#ci').value; S.cfg.nome=$('#cn').value.trim()||S.cfg.nome; S.cfg.par=$('#cp').value.trim()||S.cfg.par;
    S.cfg.code=$('#cc2').value.trim(); S.cfg.url=$('#cu').value.trim(); S.cfg.key=$('#ck').value.trim(); S.cfg.u=now(); toast('Salvo 💾'); commit(); };
}

/* ============ início ============ */
loadLocal(); applyTheme(); render();
syncNow();
setInterval(() => { if(!document.hidden) syncNow(); }, 8000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncNow(); });
</script>
</body>
