name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Chave de assinatura fixa (para o app atualizar por cima)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Chave fixa instalada."
          else
            echo "ATENCAO: segredo KEYSTORE_B64 ausente. A assinatura vai mudar a cada build."
          fi
      - run: npx cap add android
      - name: Firebase (notificacoes push)
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json instalado"; else echo "sem google-services.json (push desligado)"; fi
      - name: Icone do app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ff9ec4' --iconBackgroundColorDark '#ff9ec4'
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Impressao digital da assinatura (deve ser igual em todo build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA256|SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: nosso-cantinho-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
