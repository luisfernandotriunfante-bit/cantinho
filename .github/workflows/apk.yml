name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Chave de assinatura fixa (para o app atualizar por cima)
        env:
          KEYSTORE_B64: ${{ secrets.X1 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=CHAVE::SEGREDO_AUSENTE - o segredo X1 nao existe (ou esta vazio) em Repository secrets"
            exit 1
          fi
          echo "Tamanho do segredo: ${#KEYSTORE_B64} caracteres"
          mkdir -p ~/.android
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
            echo "::error title=CHAVE::DECODE_FALHOU - o texto colado nao e base64 valido (tamanho ${#KEYSTORE_B64})"
            exit 1
          fi
          if ! keytool -list -keystore ~/.android/debug.keystore -storepass android >/dev/null 2>&1; then
            echo "::error title=CHAVE::KEYSTORE_INVALIDO - o texto colado esta incompleto ou alterado (tamanho ${#KEYSTORE_B64}, esperado 3576)"
            exit 1
          fi
          echo "Chave fixa instalada."
      - run: npx cap add android
      - name: Firebase (notificacoes push)
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json instalado"; else echo "sem google-services.json (push desligado)"; fi
      - name: Icone do app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ff9ec4' --iconBackgroundColorDark '#ff9ec4'
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Impressao digital da assinatura (deve ser igual em todo build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA256|SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: nosso-cantinho-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
