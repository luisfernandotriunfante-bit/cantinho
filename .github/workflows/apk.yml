name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Chave de assinatura fixa (para o app atualizar por cima)
        env:
          KEYSTORE_B64: ${{ secrets.X1 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=CHAVE::SEGREDO_AUSENTE - o segredo X1 nao existe (ou esta vazio) em Repository secrets"
            exit 1
          fi
          echo "Tamanho do segredo: ${#KEYSTORE_B64} caracteres"
          mkdir -p ~/.android
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
            echo "::error title=CHAVE::DECODE_FALHOU - o texto colado nao e base64 valido (tamanho ${#KEYSTORE_B64})"
            exit 1
          fi
          if ! keytool -list -keystore ~/.android/debug.keystore -storepass android >/dev/null 2>&1; then
            echo "::error title=CHAVE::KEYSTORE_INVALIDO - o texto colado esta incompleto ou alterado (tamanho ${#KEYSTORE_B64}, esperado 3576)"
            exit 1
          fi
          echo "Chave fixa instalada."
      - run: npx cap add android
      - name: Atualizador do app (plugin, permissao e numero da versao)
        run: |
          D=android/app/src/main/java/com/nosso/cantinho
          cp android-patch/ApkInstallerPlugin.java "$D/"
          cp android-patch/MainActivity.java "$D/"
          cp android-patch/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"3.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle || { echo "::error::VERSIONCODE nao foi alterado"; exit 1; }
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml || { echo "::error::PERMISSAO nao foi adicionada"; exit 1; }
      - name: Firebase (notificacoes push)
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json instalado"; else echo "sem google-services.json (push desligado)"; fi
      - name: Icone do app
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ff9ec4' --iconBackgroundColorDark '#ff9ec4'
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Impressao digital da assinatura (deve ser igual em todo build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA256|SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: nosso-cantinho-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Preparar arquivo do release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nosso-cantinho.apk
      - name: Publicar release (o app procura atualizacoes aqui)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Versao ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: nosso-cantinho.apk
          make_latest: true
      - name: Limpar releases antigas (mantem as 5 ultimas)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y
